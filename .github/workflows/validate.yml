# CI keeps the public skill installable and free of obvious unsafe artifacts.
name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile scripts
        run: python -m compileall -q scripts assets/workspace-template
      - name: Safety scan
        run: python scripts/validate_skill_safety.py --skill-dir .
